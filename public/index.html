<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>glitchin' out — Real-Time Glitch Art</title>
    <meta name="description" content="State-of-the-art glitch art tool. Stack datamosh, pixel sort, CRT, scanline error, lens warp, snow. Live camera, free, no install, no account, no tracking.">

    <!-- OpenGraph -->
    <meta property="og:title" content="glitchin' out — Real-Time Glitch Art">
    <meta property="og:description" content="Stack chains of glitch effects over your camera or an image. Datamosh, pixel sort, CRT, scanlines, chromatic aberration, feedback. Each effect rerolls on demand.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Noise Factor">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="glitchin' out">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <link rel="preconnect" href="https://shaders.noisedeck.app" crossorigin>
    <link rel="preconnect" href="https://handfish.noisefactor.io" crossorigin>
    <link rel="preconnect" href="https://fonts.noisefactor.io" crossorigin>

    <!-- Always-needed blank placeholders; the active theme's blank is
         preloaded by the inline script below based on the saved theme. -->
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/nunito/Nunito-Blank.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono-Blank.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        /* Blank placeholders for every theme's font (declarations are
           cheap — no download until a theme actually requests the font). */
        @font-face { font-family: 'Nunito Blank';                src: url('https://fonts.noisefactor.io/fonts/nunito/Nunito-Blank.woff2') format('woff2');                                          font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Noto Sans Mono Blank';        src: url('https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono-Blank.woff2') format('woff2');                            font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Inter Blank';                 src: url('https://fonts.noisefactor.io/fonts/inter/Inter-Blank.woff2') format('woff2');                                            font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Cabin Blank';                 src: url('https://fonts.noisefactor.io/fonts/cabin/Cabin-Blank.woff2') format('woff2');                                            font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Crimson Pro Blank';           src: url('https://fonts.noisefactor.io/fonts/crimson-pro/CrimsonPro-Blank.woff2') format('woff2');                                  font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Roboto Slab Blank';           src: url('https://fonts.noisefactor.io/fonts/roboto-slab/RobotoSlab-Blank.woff2') format('woff2');                                  font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Baloo 2 Blank';               src: url('https://fonts.noisefactor.io/fonts/baloo-2/Baloo2-Blank.woff2') format('woff2');                                          font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Atkinson Hyperlegible Blank'; src: url('https://fonts.noisefactor.io/fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Blank.woff2') format('woff2');              font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Lora Blank';                  src: url('https://fonts.noisefactor.io/fonts/lora/Lora-Blank.woff2') format('woff2');                                              font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Poppins Blank';               src: url('https://fonts.noisefactor.io/fonts/poppins/Poppins-Blank.woff2') format('woff2');                                        font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Quicksand Blank';             src: url('https://fonts.noisefactor.io/fonts/quicksand/Quicksand-Blank.woff2') format('woff2');                                    font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Tomorrow Blank';              src: url('https://fonts.noisefactor.io/fonts/tomorrow/Tomorrow-Blank.woff2') format('woff2');                                      font-weight: 100 900; font-display: block; }
        @font-face { font-family: 'Comfortaa Blank';             src: url('https://fonts.noisefactor.io/fonts/comfortaa/Comfortaa-Blank.woff2') format('woff2');                                    font-weight: 100 900; font-display: block; }

        /* Real fonts: font-display: swap. Only the base ones are declared
           here; theme-specific real fonts are loaded by the active theme
           CSS at the moment that theme applies. */
        @font-face { font-family: Nunito;            src: url('https://fonts.noisefactor.io/fonts/nunito/Nunito[wght].woff2') format('woff2');                                font-weight: 100 900; font-display: swap; }
        @font-face { font-family: 'Noto Sans Mono';  src: url('https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono[wdth,wght].woff2') format('woff2');             font-weight: 100 900; font-display: swap; }

        html { font-family: Nunito, 'Nunito Blank'; }
        :root {
            --hf-font-family: Nunito, 'Nunito Blank';
            --hf-font-family-mono: 'Noto Sans Mono', 'Noto Sans Mono Blank';
        }

        /* Handfish stock theme CSS lists --hf-font-family without a Blank
           fallback for several themes. Patch each so every theme's chain
           ends in a matching Blank metric placeholder. */
        [data-theme="dusk"]                { --hf-font-family: 'Cabin', 'Cabin Blank'; }
        [data-theme="gothic"]              { --hf-font-family: 'Crimson Pro', 'Crimson Pro Blank'; }
        [data-theme="earthy"]              { --hf-font-family: 'Roboto Slab', 'Roboto Slab Blank'; }
        [data-theme="kawaii"]              { --hf-font-family: 'Baloo 2', 'Baloo 2 Blank'; }
        [data-theme="high-contrast-dark"],
        [data-theme="high-contrast-light"] { --hf-font-family: 'Atkinson Hyperlegible', 'Atkinson Hyperlegible Blank'; }
        [data-theme="newspaper"]           { --hf-font-family: 'Lora', 'Lora Blank'; }
        [data-theme="ocean"]               { --hf-font-family: 'Poppins', 'Poppins Blank'; }
        [data-theme="sunset"]              { --hf-font-family: 'Quicksand', 'Quicksand Blank'; }
        [data-theme="synthwave"]           { --hf-font-family: 'Tomorrow', 'Tomorrow Blank'; }
        [data-theme="rave"]                { --hf-font-family: 'Comfortaa', 'Comfortaa Blank'; }
    </style>

    <script type="importmap">
        { "imports": { "handfish": "https://handfish.noisefactor.io/0/handfish.esm.min.js" } }
    </script>

    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/tokens.css">
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/dialogs.css">

    <!-- Apply the saved theme synchronously and preload that theme's
         Blank metric placeholder so the page never falls back to a system
         font during the gap between theme CSS load and the real font's
         swap-in. Keep these maps in sync with js/handfish-theme.js. -->
    <script>
    (function () {
        var FILES = {
            'neutral-dark': 'neutral', 'neutral-light': 'neutral',
            'gray-dark': 'gray', 'gray-light': 'gray',
            'corporate': 'corporate',
            'high-contrast-dark': 'high-contrast', 'high-contrast-light': 'high-contrast',
            'newspaper': 'newspaper', 'gothic': 'gothic', 'terminal': 'terminal',
            'brutalist': 'brutalist', 'ocean': 'ocean', 'dusk': 'dusk',
            'sunset': 'sunset', 'earthy': 'earthy', 'organic': 'organic',
            'cyberpunk': 'cyberpunk', 'synthwave': 'synthwave',
            'rave': 'rave', 'kawaii': 'kawaii'
        }
        var THEME_BLANK = {
            'neutral-dark': null, 'neutral-light': null,
            'gray-dark': null, 'gray-light': null,
            'brutalist': null, 'cyberpunk': null, 'terminal': null,
            'corporate':           'https://fonts.noisefactor.io/fonts/inter/Inter-Blank.woff2',
            'high-contrast-dark':  'https://fonts.noisefactor.io/fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Blank.woff2',
            'high-contrast-light': 'https://fonts.noisefactor.io/fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Blank.woff2',
            'newspaper':           'https://fonts.noisefactor.io/fonts/lora/Lora-Blank.woff2',
            'gothic':              'https://fonts.noisefactor.io/fonts/crimson-pro/CrimsonPro-Blank.woff2',
            'ocean':               'https://fonts.noisefactor.io/fonts/poppins/Poppins-Blank.woff2',
            'dusk':                'https://fonts.noisefactor.io/fonts/cabin/Cabin-Blank.woff2',
            'sunset':              'https://fonts.noisefactor.io/fonts/quicksand/Quicksand-Blank.woff2',
            'earthy':              'https://fonts.noisefactor.io/fonts/roboto-slab/RobotoSlab-Blank.woff2',
            'organic':             null,
            'synthwave':           'https://fonts.noisefactor.io/fonts/tomorrow/Tomorrow-Blank.woff2',
            'rave':                'https://fonts.noisefactor.io/fonts/comfortaa/Comfortaa-Blank.woff2',
            'kawaii':              'https://fonts.noisefactor.io/fonts/baloo-2/Baloo2-Blank.woff2'
        }
        var stored = null
        try { stored = localStorage.getItem('glitcher.theme.v1') } catch (e) {}
        var theme = (stored && FILES[stored]) ? stored : 'synthwave'
        document.documentElement.setAttribute('data-theme', theme)

        var blankUrl = THEME_BLANK[theme]
        if (blankUrl) {
            var pre = document.createElement('link')
            pre.rel = 'preload'
            pre.as = 'font'
            pre.type = 'font/woff2'
            pre.crossOrigin = 'anonymous'
            pre.href = blankUrl
            document.head.appendChild(pre)
        }

        var link = document.createElement('link')
        link.id = 'hf-theme-link'
        link.rel = 'stylesheet'
        link.href = 'https://handfish.noisefactor.io/0/styles/themes/' + FILES[theme] + '.css'
        document.head.appendChild(link)
    })()
    </script>

    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="app">
        <header id="title-bar">
            <h1 class="title">glitchin' out</h1>
            <div class="title-actions">
                <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button id="about-btn" class="icon-btn" title="About glitchin' out" aria-label="About glitchin' out">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <circle cx="10" cy="5.5" r="1.5"/>
                        <rect x="8.75" y="8.5" width="2.5" height="7" rx="1"/>
                    </svg>
                </button>
            </div>
        </header>

        <main id="stage">
            <div class="canvas-wrap">
                <canvas id="stage-canvas"></canvas>
                <div id="error-banner" class="error-banner hidden">
                    <p class="error-title">Camera access required</p>
                    <p class="error-body">Allow camera access and reload, or upload an image to continue.</p>
                </div>
            </div>
        </main>

        <section id="glitchify-row">
            <button id="glitchify-btn" class="glitchify-btn" title="Random stack (G)">
                <span class="glitchify-label">GLITCHIFY</span>
            </button>
            <button id="reroll-all-btn" class="reroll-all-btn" title="Re-roll all effects (R)" aria-label="Re-roll all">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                </svg>
                <span>RE-ROLL ALL</span>
            </button>
            <button id="share-btn" class="share-btn" title="Copy share link" aria-label="Copy share link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
                    <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
                </svg>
                <span>SHARE</span>
            </button>
        </section>

        <section id="stack-section">
            <div class="stack-header">
                <span class="stack-label">STACK</span>
                <button id="add-effect-btn" class="add-effect-btn" type="button" aria-haspopup="menu" aria-expanded="false">
                    <span class="add-effect-plus">+</span>
                    <span>ADD EFFECT</span>
                </button>
                <div id="effect-picker" class="effect-picker" role="menu" aria-label="Effects"></div>
            </div>
            <div id="stack-list" class="stack-list"></div>
        </section>

        <section id="starter-rail-wrap" class="starter-rail-wrap">
            <span class="starter-label">START</span>
            <div id="starter-rail" class="starter-rail" role="tablist" aria-label="Starter chains"></div>
        </section>

        <footer id="bottom-bar">
            <div class="bottom-left">
                <div class="mode-toggle" role="tablist" aria-label="Capture mode">
                    <button class="mode-btn active" data-mode="photo" role="tab" aria-selected="true">Photo</button>
                    <button class="mode-btn" data-mode="video" role="tab" aria-selected="false">Video</button>
                </div>
                <button id="upload-btn" class="icon-btn" title="Upload image" aria-label="Upload image">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path d="M10 3l5 5h-3v6H8V8H5l5-5zM4 16h12v2H4v-2z"/>
                    </svg>
                </button>
                <button id="camera-btn" class="icon-btn" title="Use camera" aria-label="Use camera">
                    <svg viewBox="0 -960 960 960" fill="currentColor" width="20" height="20">
                        <path d="M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM160-120q-33 0-56.5-23.5T80-200v-480q0-33 23.5-56.5T160-760h126l74-80h240l74 80h126q33 0 56.5 23.5T880-680v480q0 33-23.5 56.5T800-120H160Zm0-80h640v-480H638l-73-80H395l-73 80H160v480Zm320-240Z"/>
                    </svg>
                </button>
                <button id="camera-flip-btn" class="icon-btn hidden" title="Switch camera" aria-label="Switch camera">
                    <svg viewBox="0 -960 960 960" fill="currentColor" width="20" height="20">
                        <path d="M280-240v120-720 600Zm228.5-491.5Q520-743 520-760t-11.5-28.5Q497-800 480-800t-28.5 11.5Q440-777 440-760t11.5 28.5Q463-720 480-720t28.5-11.5ZM680-240h80v120q0 33-23.5 56.5T680-40H280q-33 0-56.5-23.5T200-120v-720q0-33 23.5-56.5T280-920h400q33 0 56.5 23.5T760-840v120h-80v-120H280v720h400v-120Zm-100-80q-25 0-42.5-17.5T520-380v-160q0-25 17.5-42.5T580-600h40l40-40h80l40 40h40q25 0 42.5 17.5T880-540v160q0 25-17.5 42.5T820-320H580Zm169.5-90.5Q770-431 770-460t-20.5-49.5Q729-530 700-530t-49.5 20.5Q630-489 630-460t20.5 49.5Q671-390 700-390t49.5-20.5Z"/>
                    </svg>
                </button>
                <button id="mirror-btn" class="icon-btn" title="Flip horizontal" aria-label="Flip horizontal">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <polygon points="2,10 8,5 8,15"/>
                        <polygon points="18,10 12,5 12,15"/>
                        <rect x="9.5" y="4" width="1" height="12" opacity="0.5"/>
                    </svg>
                </button>
            </div>

            <button id="shutter-btn" class="shutter-btn" aria-label="Capture"></button>

            <div class="bottom-right">
                <div id="recording-status" class="recording-indicator hidden">
                    <span class="recording-dot"></span>
                    <span id="recording-timer">0:00</span>
                </div>
                <div id="filmstrip-thumbs" class="filmstrip-thumbs"></div>
            </div>
        </footer>
        <input id="file-input" type="file" accept="image/*" class="hidden">

        <dialog id="settings-dialog" class="settings-dialog">
            <div class="settings-dialog-head">
                <h2>Settings</h2>
                <button id="settings-close" class="icon-btn" aria-label="Close settings">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="settings-dialog-body">
                <section class="settings-section">
                    <h3>Appearance</h3>
                    <div class="settings-row">
                        <label for="theme-picker-host">Theme</label>
                        <span id="theme-picker-host" class="theme-picker-host"></span>
                    </div>
                    <p class="settings-hint">Handfish themes. Picks your color palette, font, and surface treatment site-wide.</p>
                </section>
            </div>
        </dialog>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
