<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Glitcher — Real-Time Glitch Art</title>
    <meta name="description" content="State-of-the-art glitch art tool. Stack datamosh, pixel sort, CRT, scanline error, lens warp, snow. Live camera, free, no install, no account, no tracking.">

    <!-- OpenGraph -->
    <meta property="og:title" content="Glitcher — Real-Time Glitch Art">
    <meta property="og:description" content="Stack chains of glitch effects over your camera or an image. Datamosh, pixel sort, CRT, scanlines, chromatic aberration, feedback. Each effect rerolls on demand.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Noise Factor">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080010">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Glitcher">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <link rel="preconnect" href="https://shaders.noisedeck.app" crossorigin>
    <link rel="preconnect" href="https://handfish.noisefactor.io" crossorigin>
    <script type="importmap">
        { "imports": { "handfish": "https://handfish.noisefactor.io/0/handfish.esm.min.js" } }
    </script>
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/tokens.css">
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/dialogs.css">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="app">
        <header id="title-bar">
            <h1 class="title">
                <span class="title-shadow title-shadow-cyan">GLITCHER</span>
                <span class="title-shadow title-shadow-magenta">GLITCHER</span>
                <span class="title-main">GLITCHER</span>
            </h1>
            <button id="about-btn" class="icon-btn" title="About Glitcher" aria-label="About Glitcher">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                    <circle cx="10" cy="5.5" r="1.5"/>
                    <rect x="8.75" y="8.5" width="2.5" height="7" rx="1"/>
                </svg>
            </button>
        </header>

        <main id="stage">
            <div class="canvas-wrap">
                <canvas id="stage-canvas"></canvas>
                <div id="error-banner" class="error-banner hidden">
                    <p class="error-title">Camera access required</p>
                    <p class="error-body">Allow camera access and reload, or upload an image to continue.</p>
                </div>
            </div>
        </main>

        <section id="glitchify-row">
            <button id="glitchify-btn" class="glitchify-btn" title="Random stack (G)">
                <span class="glitchify-bg"></span>
                <span class="glitchify-label">GLITCHIFY</span>
            </button>
            <button id="reroll-all-btn" class="reroll-all-btn" title="Re-roll all effects (R)" aria-label="Re-roll all">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                </svg>
                <span>RE-ROLL ALL</span>
            </button>
            <button id="share-btn" class="share-btn" title="Copy share link" aria-label="Copy share link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
                    <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
                </svg>
                <span>SHARE</span>
            </button>
        </section>

        <section id="stack-section">
            <div class="stack-header">
                <span class="stack-label">STACK</span>
                <button id="add-effect-btn" class="add-effect-btn" type="button" aria-haspopup="menu" aria-expanded="false">
                    <span class="add-effect-plus">+</span>
                    <span>ADD EFFECT</span>
                </button>
                <div id="effect-picker" class="effect-picker" role="menu" aria-label="Effects"></div>
            </div>
            <div id="stack-list" class="stack-list"></div>
        </section>

        <section id="starter-rail-wrap" class="starter-rail-wrap">
            <span class="starter-label">START</span>
            <div id="starter-rail" class="starter-rail" role="tablist" aria-label="Starter chains"></div>
        </section>

        <footer id="bottom-bar">
            <div class="bottom-left">
                <div class="mode-toggle" role="tablist" aria-label="Capture mode">
                    <button class="mode-btn active" data-mode="photo" role="tab" aria-selected="true">Photo</button>
                    <button class="mode-btn" data-mode="video" role="tab" aria-selected="false">Video</button>
                </div>
                <button id="upload-btn" class="icon-btn" title="Upload image" aria-label="Upload image">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path d="M10 3l5 5h-3v6H8V8H5l5-5zM4 16h12v2H4v-2z"/>
                    </svg>
                </button>
                <button id="camera-btn" class="icon-btn" title="Use camera" aria-label="Use camera">
                    <svg viewBox="0 -960 960 960" fill="currentColor" width="20" height="20">
                        <path d="M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM160-120q-33 0-56.5-23.5T80-200v-480q0-33 23.5-56.5T160-760h126l74-80h240l74 80h126q33 0 56.5 23.5T880-680v480q0 33-23.5 56.5T800-120H160Zm0-80h640v-480H638l-73-80H395l-73 80H160v480Zm320-240Z"/>
                    </svg>
                </button>
                <button id="camera-flip-btn" class="icon-btn hidden" title="Switch camera" aria-label="Switch camera">
                    <svg viewBox="0 -960 960 960" fill="currentColor" width="20" height="20">
                        <path d="M280-240v120-720 600Zm228.5-491.5Q520-743 520-760t-11.5-28.5Q497-800 480-800t-28.5 11.5Q440-777 440-760t11.5 28.5Q463-720 480-720t28.5-11.5ZM680-240h80v120q0 33-23.5 56.5T680-40H280q-33 0-56.5-23.5T200-120v-720q0-33 23.5-56.5T280-920h400q33 0 56.5 23.5T760-840v120h-80v-120H280v720h400v-120Zm-100-80q-25 0-42.5-17.5T520-380v-160q0-25 17.5-42.5T580-600h40l40-40h80l40 40h40q25 0 42.5 17.5T880-540v160q0 25-17.5 42.5T820-320H580Zm169.5-90.5Q770-431 770-460t-20.5-49.5Q729-530 700-530t-49.5 20.5Q630-489 630-460t20.5 49.5Q671-390 700-390t49.5-20.5Z"/>
                    </svg>
                </button>
                <button id="mirror-btn" class="icon-btn" title="Flip horizontal" aria-label="Flip horizontal">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <polygon points="2,10 8,5 8,15"/>
                        <polygon points="18,10 12,5 12,15"/>
                        <rect x="9.5" y="4" width="1" height="12" opacity="0.5"/>
                    </svg>
                </button>
            </div>

            <button id="shutter-btn" class="shutter-btn" aria-label="Capture"></button>

            <div class="bottom-right">
                <div id="recording-status" class="recording-indicator hidden">
                    <span class="recording-dot"></span>
                    <span id="recording-timer">0:00</span>
                </div>
                <div id="filmstrip-thumbs" class="filmstrip-thumbs"></div>
            </div>
        </footer>
        <input id="file-input" type="file" accept="image/*" class="hidden">
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
