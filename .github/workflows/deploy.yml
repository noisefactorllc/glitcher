name: Deploy

# Scaffold is the sole authority for glitcher deploys. This workflow
# just fires the workflow_dispatch at scaffold's static-site-release,
# which clones this repo at the pushed SHA, writes deployment-meta.json
# into public/, and rsyncs public/ to
# ~/sites/glitcher.noisefactor.io/content on nf-toronto.
#
# Keeping the SSH key + server IP on the scaffold side means this
# public repo carries no deploy secrets — only the EHSRE app private
# key, which is scoped to dispatching scaffold workflows.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Mint scaffold GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch scaffold static-site-release for glitcher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f site=glitcher \
            -f sha=${{ github.sha }}
          echo "Dispatched scaffold static-site-release for glitcher @ ${{ github.sha }}"
